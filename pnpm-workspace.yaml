packages:
  - packages/*

catalog:
  "@types/node": 26.4.0
  "@types/pngjs": 6.0.5
  "@vitest/coverage-v8": 4.1.11
  jscpd: 5.1.1
  knip: 6.34.0
  oxfmt: 0.65.0
  oxlint: 1.80.0
  pngjs: 7.0.0
  react-native-platform-override: 0.84.0
  react-native-worklets: 0.13.1
  typescript: 7.0.2
  vitest: 4.1.11

minimumReleaseAgeExclude:
  - jscpd-darwin-arm64@5.1.1
  - jscpd-darwin-x64@5.1.1
  - jscpd-linux-arm64-gnu@5.1.1
  - jscpd-linux-x64-gnu@5.1.1
  - jscpd-linux-x64-musl@5.1.1
  - jscpd-windows-arm64-msvc@5.1.1
  - jscpd-windows-x64-msvc@5.1.1
  - jscpd@5.1.1
  - knip@6.34.0

patchedDependencies:
  react-native-worklets@0.13.1: patches/react-native-worklets@0.13.1.patch
  react-native@0.88.1: patches/react-native@0.88.1.patch

# expo-constants imports only types from its `expo` peer, and expo-file-system nothing at all, so the Expo e2e installs
# them without the expo CLI (ADR-0004).
packageExtensions:
  expo-constants@58:
    peerDependenciesMeta:
      expo:
        optional: true
  expo-file-system@58:
    peerDependenciesMeta:
      expo:
        optional: true
  # Its reanimated imports resolve to @react-native-linux/reanimated through the linux package alias (#279).
  react-native-keyboard-controller@1:
    peerDependenciesMeta:
      react-native-reanimated:
        optional: true
