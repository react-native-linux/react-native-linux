name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Cache vendored React Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/react-native
          key: rnl-vendor-react-native-ubuntu-24.04-${{ hashFiles('scripts/vendor.lock.json', 'scripts/vendor-react-native.ts') }}

      - name: Vendor React Native
        run: node scripts/vendor-react-native.ts

      # Issue #85: the codegen artifacts are checked in, so a regeneration must be a no-op. --intent-to-add makes
      # a file the generator added but nobody committed show up in the diff instead of staying untracked.
      - name: Assert the checked-in core codegen is current
        run: |
          set -euo pipefail
          pnpm codegen
          git add --intent-to-add -- packages/core/generated
          git diff --exit-code -- packages/core/generated

      # Issue #179: every packages/*/upstream.lock.json is re-vendored into a temporary directory and its patch
      # queue replayed, then compared with the checked-in packages/*/upstream tree. A hand edit to a vendored
      # file that never became a patch fails here. With no lock files present the step passes and says so.
      - name: Assert the vendored upstream trees match their locks and patch queues
        run: pnpm upstream:check

      # Issue #69: every prop the five shipped components declare is enumerated from the vendored props headers
      # and has to be in docs/prop-coverage.json, every "implemented" entry has to name a test or golden that
      # still exists, and docs/prop-coverage.md has to be the rendering of that ledger. It runs after the vendor
      # step because the headers it parses are the vendored ones.
      - name: Assert the prop-coverage ledger covers every declared prop
        run: pnpm prop-coverage:check

  meta:
    name: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run actionlint
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: Run typos
        uses: crate-ci/typos@7e6020579a1b0902e0524a02981670a3844514db # v1.50.0

      - name: Install shellcheck
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: Install shfmt
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          echo "fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66  /tmp/shfmt" | sha256sum -c -
          chmod +x /tmp/shfmt
          sudo install /tmp/shfmt /usr/local/bin/shfmt

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run shellcheck, shfmt, and gitleaks
        run: node scripts/validate-meta.ts

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      LLVM_COV: llvm-cov-18
      LLVM_PROFDATA: llvm-profdata-18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test preset never touches Hermes or Skia: RNL_BUILD_TESTS stops the configure before
      # either is reached, so this job needs only the ReactCommon/folly prerequisites and LLVM's
      # coverage tools, not freetype, fontconfig, Wayland or Vulkan.
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang-18 \
            clang-tools-18 \
            cmake \
            git \
            libboost-dev \
            libclang-rt-18-dev \
            libdouble-conversion-dev \
            libfmt-dev \
            libgoogle-glog-dev \
            libicu-dev \
            llvm-18 \
            ninja-build \
            pkg-config \
            python3
          clang-18 --version
          cmake --version

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache vendored React Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/react-native
          key: rnl-vendor-react-native-ubuntu-24.04-${{ hashFiles('scripts/vendor.lock.json', 'scripts/vendor-react-native.ts') }}

      - name: Vendor React Native
        run: node scripts/vendor-react-native.ts

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: rnl-ccache-ubuntu-24.04-clang-18-test-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'packages/core/tests/CMakeLists.txt', 'scripts/vendor.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            rnl-ccache-ubuntu-24.04-clang-18-test-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'packages/core/tests/CMakeLists.txt', 'scripts/vendor.lock.json') }}-
            rnl-ccache-ubuntu-24.04-clang-18-test-

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          printf 'max_size = 2G\ncompression = true\n' > "$CCACHE_DIR/ccache.conf"
          ccache --zero-stats

      - name: Configure
        run: cmake --preset test

      - name: Build rnl_core_tests
        run: cmake --build --preset test

      - name: Report ccache and disk usage
        if: always()
        run: |
          set -euo pipefail
          ccache --show-stats
          df -h /

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: rnl-ccache-ubuntu-24.04-clang-18-test-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'packages/core/tests/CMakeLists.txt', 'scripts/vendor.lock.json') }}-${{ github.run_id }}

      - name: Run rnl_core_tests under ctest
        run: ctest --preset test

      - name: Coverage gate
        run: node scripts/cpp-coverage.ts

  native:
    name: native (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: dev
            skia: "ON"
          - preset: asan
            skia: "OFF"
          - preset: tsan
            skia: "OFF"
    env:
      CC: clang-18
      CXX: clang++-18
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      RNL_ENABLE_SKIA: ${{ matrix.skia }}
      RNL_PRESET: ${{ matrix.preset }}
      ASAN_OPTIONS: detect_leaks=1:external_symbolizer_path=/usr/lib/llvm-18/bin/llvm-symbolizer
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:external_symbolizer_path=/usr/lib/llvm-18/bin/llvm-symbolizer
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:external_symbolizer_path=/usr/lib/llvm-18/bin/llvm-symbolizer
    steps:
      # Hermes plus the ReactCommon closure is several GB of objects per preset, and more again under a
      # sanitizer. The runner image ships toolchains this build never touches; dropping them buys ~25 GB.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # The sanitizer runtimes map fixed shadow regions and abort when the kernel hands out more ASLR
      # entropy than they were built for. 28 is the Ubuntu 24.04 default and what compiler-rt 18 expects.
      - name: Relax ASLR entropy for the sanitizer runtimes
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirrors the Ubuntu prerequisites in docs/cpp-toolchain.md. libboost-dev is 1.83.0 on 24.04, exactly
      # RNL_BOOST_VERSION, and ships BoostConfig.cmake, so find_package(Boost CONFIG) hits and the 145 MB
      # FetchContent fallback never runs. libclang-rt-18-dev carries the ASan/UBSan/TSan runtimes, which
      # Debian splits out of the clang package.
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang-18 \
            clang-tools-18 \
            cmake \
            git \
            libboost-dev \
            libclang-rt-18-dev \
            libdouble-conversion-dev \
            libfmt-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libgoogle-glog-dev \
            libicu-dev \
            llvm-18 \
            ninja-build \
            pkg-config \
            python3
          clang-18 --version
          cmake --version

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache vendored React Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/react-native
          key: rnl-vendor-react-native-ubuntu-24.04-${{ hashFiles('scripts/vendor.lock.json', 'scripts/vendor-react-native.ts') }}

      - name: Vendor React Native
        run: node scripts/vendor-react-native.ts

      - name: Cache vendored Skia
        if: matrix.skia == 'ON'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/skia
          key: rnl-vendor-skia-ubuntu-24.04-${{ hashFiles('scripts/skia.lock.json', 'scripts/vendor-skia.ts') }}

      - name: Vendor Skia
        if: matrix.skia == 'ON'
        run: node scripts/vendor-skia.ts

      # The text golden is only reproducible against the pinned font files; without them the paragraph would be
      # shaped with whatever fontconfig finds on the runner, which is not what the checked-in PNG was made from.
      - name: Cache vendored fonts
        if: matrix.skia == 'ON'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/fonts
          key: rnl-vendor-fonts-ubuntu-24.04-${{ hashFiles('scripts/fonts.lock.json', 'scripts/vendor-fonts.ts') }}

      - name: Vendor fonts
        if: matrix.skia == 'ON'
        run: node scripts/vendor-fonts.ts

      # Restored on every event, saved only from main: a per-preset ccache is ~2 GB and the repository cache
      # ceiling is 10 GB, so letting every pull request write its own copy would evict the warm entry the
      # rest of them read. Pull requests therefore warm from main and never pay the storage.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: rnl-ccache-ubuntu-24.04-clang-18-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'scripts/vendor.lock.json', 'scripts/skia.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            rnl-ccache-ubuntu-24.04-clang-18-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'scripts/vendor.lock.json', 'scripts/skia.lock.json') }}-
            rnl-ccache-ubuntu-24.04-clang-18-${{ matrix.preset }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          printf 'max_size = 2G\ncompression = true\n' > "$CCACHE_DIR/ccache.conf"
          ccache --zero-stats

      # RNL_ENABLE_WINDOW is left ON deliberately. Neither wayland-client nor a Vulkan loader is installed,
      # so configure has to print "rnl_window is disabled, missing: ..." and carry on; a fatal error there is
      # a regression in the graceful-degradation path.
      - name: Configure
        run: cmake --preset "$RNL_PRESET" -DRNL_ENABLE_SKIA="$RNL_ENABLE_SKIA"

      - name: Build hello_react
        run: cmake --build "build/$RNL_PRESET" --target hello_react

      - name: Report ccache and disk usage
        if: always()
        run: |
          set -euo pipefail
          ccache --show-stats
          df -h /
          du -sh "build/$RNL_PRESET" || true

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: rnl-ccache-ubuntu-24.04-clang-18-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'scripts/vendor.lock.json', 'scripts/skia.lock.json') }}-${{ github.run_id }}

      - name: Run hello_react acceptance paths
        run: |
          set -euo pipefail
          binary="build/$RNL_PRESET/bin/hello_react"

          "$binary" | tee /tmp/rnl-smoke.log
          grep -q "react-native-linux: hermes alive" /tmp/rnl-smoke.log

          "$binary" packages/core/test-bundles/hello.js | tee /tmp/rnl-hello.log
          grep -q "react-native-linux: timer fired" /tmp/rnl-hello.log
          grep -q "react-native-linux: nested timer fired" /tmp/rnl-hello.log
          grep -q "react-native-linux: bundle done" /tmp/rnl-hello.log

          status=0
          "$binary" packages/core/test-bundles/throws.js > /tmp/rnl-throws.log 2>&1 || status=$?
          cat /tmp/rnl-throws.log
          test "$status" -eq 1
          grep -q "\[js-error\] fatal" /tmp/rnl-throws.log

          "$binary" --fabric packages/core/test-bundles/fabric-view.js | tee /tmp/rnl-fabric.log
          grep -q "fabric-view: committed surface 1" /tmp/rnl-fabric.log
          grep -q "View #4 frame=(24.00, 24.00, 120.00, 80.00) backgroundColor=rgba(51, 102, 204, 1)" /tmp/rnl-fabric.log

          "$binary" --fabric packages/core/test-bundles/scroll.js | tee /tmp/rnl-scroll.log
          grep -q "scroll: committed surface 1" /tmp/rnl-scroll.log
          grep -qE 'ScrollView #3 frame=\(60\.00, 60\.00, 200\.00, 150\.00\).*contentOffset=\(0\.00, 0\.00\)' /tmp/rnl-scroll.log

          # The <TextInput> descriptor is ours rather than upstream's, so this proves it is registered and that a
          # secure field reaches the mounting layer masked. It needs no Skia: the dump is the scene, not a layout.
          "$binary" --fabric packages/core/test-bundles/text-input.js | tee /tmp/rnl-text-input.log
          grep -q "text-input: committed surface 1" /tmp/rnl-text-input.log
          grep -q "TextInput #10" /tmp/rnl-text-input.log
          if grep -qE 'TextInput #[0-9]+ .*hunter2' /tmp/rnl-text-input.log; then exit 1; fi

          # The first TurboModule, and the never-0x0 rule of issue #50: the surface's own extent at boot, screen
          # equal to window, and exactly one didUpdateDimensions for the resize that follows.
          "$binary" --resize packages/core/test-bundles/dimensions.js 640 480 | tee /tmp/rnl-dimensions.log
          grep -q "dimensions: constants window 800x600 scale 1 fontScale 1" /tmp/rnl-dimensions.log
          grep -q "dimensions: constants screen 800x600 scale 1 fontScale 1" /tmp/rnl-dimensions.log
          grep -q "dimensions: didUpdateDimensions window 640x480 scale 1 fontScale 1" /tmp/rnl-dimensions.log
          grep -q "dimensions: didUpdateDimensions screen 640x480 scale 1 fontScale 1" /tmp/rnl-dimensions.log
          test "$(grep -c 'dimensions: didUpdateDimensions window' /tmp/rnl-dimensions.log)" -eq 1

          # The C++ AnimatedModule of #127 and #128: registered under its own name, and a full operation batch
          # accepted through the generated NativeAnimatedModule spec. The value is the choreographer of #129: the
          # batch is drained by an animation frame, the frames driver runs to its toValue on that frame, and the
          # end callback asks for the value back on the next one. Without a frame source none of the three prints.
          "$binary" --fabric packages/core/test-bundles/animated.js | tee /tmp/rnl-animated.log
          grep -q "animated: module present" /tmp/rnl-animated.log
          grep -q "animated: batch ok" /tmp/rnl-animated.log
          grep -q "animated: value 0.75" /tmp/rnl-animated.log

          # Event-driven Animated (#131): Animated.event wiring on a ScrollView, driven by three wheel notches.
          # Every trace line carries the frame's scroll offset and the animated value it drove, and the two have
          # to be the same number on the same line — a value applied one frame late is what upstream fixed in
          # 0.86 and what the backreference below fails on. The last line is the settled 3 x 40 points.
          "$binary" --animated-scroll packages/core/test-bundles/animated-scroll.js 160 100 3 \
            | tee /tmp/rnl-animated-scroll.log
          grep -q "animated-scroll: committed surface 1" /tmp/rnl-animated-scroll.log
          grep -qE 'animated-scroll: offset ([0-9]+\.[0-9]{2}) value \1' /tmp/rnl-animated-scroll.log
          if grep 'animated-scroll: offset' /tmp/rnl-animated-scroll.log \
            | grep -vqE 'animated-scroll: offset ([0-9]+\.[0-9]{2}) value \1'; then exit 1; fi
          grep -q "animated-scroll: offset 120.00 value 120.00" /tmp/rnl-animated-scroll.log

      # Only the Skia entry has a TextLayoutManager behind Yoga; with -DRNL_ENABLE_SKIA=OFF the upstream stub is
      # still compiled in and every paragraph measures as zero, so this assertion belongs to the dev entry alone.
      - name: Run the text acceptance path
        if: matrix.skia == 'ON'
        run: |
          set -euo pipefail
          binary="build/$RNL_PRESET/bin/hello_react"

          "$binary" --fabric packages/core/test-bundles/text.js | tee /tmp/rnl-text.log
          grep -q "text: committed surface 1" /tmp/rnl-text.log
          grep -qE 'Paragraph #[0-9]+ frame=.* text="Text renders on Linux"' /tmp/rnl-text.log

          # Typing into the field: the ordered event trace of issues #17, #53 and #54, and the caret geometry it
          # implies. It needs Skia because a caret is measured against a laid-out paragraph.
          "$binary" --type packages/core/test-bundles/text-input.js /tmp/rnl-typing.png "Hello{Left}{Left}X" \
            | tee /tmp/rnl-typing.log
          grep -q "text-input: topFocus on plain" /tmp/rnl-typing.log
          grep -q 'text-input: topChange on plain text="H"' /tmp/rnl-typing.log
          grep -q 'text-input: topChange on plain text="HelXlo"' /tmp/rnl-typing.log
          grep -q "text-input: topKeyPress on plain key=H" /tmp/rnl-typing.log

      - name: Compare golden images
        if: matrix.skia == 'ON'
        run: pnpm test:golden

  # The only job that reaches SkiaVulkanRenderer: a real swapchain on a real wl_surface, drawn by lavapipe under
  # a headless weston. It is deliberately separate from native (dev), which proves the opposite thing — that a
  # configure with no Wayland and no Vulkan loader disables rnl_window and carries on. Installing the graphics
  # stack there would delete that test.
  window:
    name: window
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CC: clang-18
      CXX: clang++-18
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The native list plus what rnl_window needs to build and what the rig needs to run: libwayland-dev and
      # wayland-protocols for the xdg-shell client, libxkbcommon-dev for the keymap, libvulkan-dev for the loader
      # and headers, mesa-vulkan-drivers for the lavapipe ICD, and weston for the headless compositor.
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang-18 \
            clang-tools-18 \
            cmake \
            git \
            libboost-dev \
            libdouble-conversion-dev \
            libfmt-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libgoogle-glog-dev \
            libicu-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            ninja-build \
            pkg-config \
            python3 \
            wayland-protocols \
            weston
          clang-18 --version
          weston --version
          ls -la /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true
          dpkg -L mesa-vulkan-drivers | grep -iE "lvp|icd" || true
          ls /usr/share/vulkan/icd.d

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache vendored React Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/react-native
          key: rnl-vendor-react-native-ubuntu-24.04-${{ hashFiles('scripts/vendor.lock.json', 'scripts/vendor-react-native.ts') }}

      - name: Vendor React Native
        run: node scripts/vendor-react-native.ts

      - name: Cache vendored Skia
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/skia
          key: rnl-vendor-skia-ubuntu-24.04-${{ hashFiles('scripts/skia.lock.json', 'scripts/vendor-skia.ts') }}

      - name: Vendor Skia
        run: node scripts/vendor-skia.ts

      # Neither window fixture draws text, but the Linux TextLayoutManager is linked either way and the fonts are
      # what keep a future text fixture reproducible.
      - name: Cache vendored fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/fonts
          key: rnl-vendor-fonts-ubuntu-24.04-${{ hashFiles('scripts/fonts.lock.json', 'scripts/vendor-fonts.ts') }}

      - name: Vendor fonts
        run: node scripts/vendor-fonts.ts

      # Warms from the native (dev) entry's cache, which shares the compiler, the preset and every expensive
      # translation unit; only the window sources are new. Saved under its own key so the two jobs never race
      # for the same entry on a push to main.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: rnl-ccache-ubuntu-24.04-clang-18-window-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'scripts/vendor.lock.json', 'scripts/skia.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            rnl-ccache-ubuntu-24.04-clang-18-window-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'scripts/vendor.lock.json', 'scripts/skia.lock.json') }}-
            rnl-ccache-ubuntu-24.04-clang-18-window-
            rnl-ccache-ubuntu-24.04-clang-18-dev-

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          printf 'max_size = 2G\ncompression = true\n' > "$CCACHE_DIR/ccache.conf"
          ccache --zero-stats

      - name: Configure
        run: cmake --preset dev

      # This is also the assertion that the window half configured: RNL_ENABLE_WINDOW skips the target rather
      # than failing when Wayland or Vulkan is missing, so an incomplete apt list shows up here as an unknown
      # target rather than as a silent skip.
      - name: Build rnl_window
        run: cmake --build build/dev --target rnl_window

      - name: Report ccache and disk usage
        if: always()
        run: |
          set -euo pipefail
          ccache --show-stats
          df -h /
          du -sh build/dev || true

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: rnl-ccache-ubuntu-24.04-clang-18-window-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'packages/core/CMakeLists.txt', 'scripts/vendor.lock.json', 'scripts/skia.lock.json') }}-${{ github.run_id }}

      # The spec skips itself when weston, lavapipe or the binary is missing, so on a runner the assertion that it
      # did *not* skip is what proves the rig ran at all. Without it an incomplete apt list would pass silently.
      - name: Compare window goldens
        run: |
          set -euo pipefail
          pnpm test:golden:window | tee /tmp/rnl-window-golden.log
          ! grep -q "skipping window goldens" /tmp/rnl-window-golden.log

      - name: Upload the rendered window images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: window-goldens
          path: build/window-goldens/*.png
          if-no-files-found: warn

      # The e2e driver of #7 needs a compositor that implements the virtual pointer and virtual keyboard
      # protocols, and weston implements neither: its only injection surface is the weston-test plugin, which
      # upstream builds with install: false and no distribution ships. cage is wlroots, runs headless through
      # WLR_BACKENDS, and runs the window as its own child. See *E2E driver (#7)* in docs/cpp-toolchain.md.
      - name: Install cage
        run: sudo apt-get install -y cage

      - name: Build rnl_inject
        run: cmake --build build/dev --target rnl_inject

      # pnpm e2e exits 2 when the compositor, the lavapipe ICD or a binary is missing, so an incomplete apt list
      # fails the job here rather than passing as a silent skip.
      - name: Run the e2e scenarios
        run: pnpm e2e

      # Always, not only on failure: build/e2e carries the wp_presentation frame logs of #7, and a passing run's
      # numbers are the baseline the next run's budget is judged against. It is also where the picture the
      # pressable scenario's screenshot golden gets blessed from comes out.
      - name: Upload the e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e
          path: build/e2e
          if-no-files-found: warn
